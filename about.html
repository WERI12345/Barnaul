<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщить о неточности — Памятники Барнаула</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>🔧 Сообщить о недочёте</h1>
        <p>Нашли ошибку в описании или локации памятника? Напишите нам, чтобы сделать проект точнее.</p>
    </header>

    <main class="main-content">
        <div class="share-card">
            <form action="#" method="POST">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Название памятника или страницы:</label>
                    <input type="text" placeholder="Например: Демидовский столп" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Что именно нужно исправить?</label>
                    <textarea placeholder="Опишите ошибку или неточность..." rows="5" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; resize: vertical;"></textarea>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Ваш Email для связи (необязательно):</label>
                    <input type="email" placeholder="example@mail.ru" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc;">
                </div>

                <button type="submit" class="share-btn download-btn" style="margin: 0;">Отправить сообщение</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="share-btn" style="background: #6c757d; text-decoration: none;">← Вернуться на главную</a>
        </p>
    </main>

    <footer class="footer">
        <p>2026 | Историко-культурный проект о памятниках Барнаула.<br>
        <a href="catalog.html">Поделиться</a> • <a href="index.html">На главную</a></p>
    </footer>
</body>
</html>
